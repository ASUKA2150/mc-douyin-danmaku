// =====================================================================
//  Fabric / Minecraft 1.20.1 子项目
//
//  这个文件是 fabric/build.gradle（1.21.1）的副本，
//  两边逻辑完全一样——因为核心代码和 Fabric 端的代码都是共用的，
//  只有 gradle.properties 里的版本号不同。
//
//  改这个文件的时候，记得同步改 fabric/build.gradle，反之亦然。
// =====================================================================

// Loom 插件版本必须是字面量（plugins {} 块不支持属性插值）。
// 改这里的时候也要同步改 gradle.properties 里的 fabric.loom.version
// （那个值只是文档，插件块读不到它）。
//
// 注意：Loom 1.11.x 同时支持 Minecraft 1.20.1 和 1.21.1，
// 所以两个 Fabric 子项目用的是同一个 Loom 版本。
plugins {
    id 'fabric-loom' version '1.11.8'
    id 'maven-publish'
}

// 用 project.property(...) 取版本号。
// 直接写 "${minecraft.version}" 不行——Loom 把 minecraft 注册成了扩展名，
// Groovy 会优先当成扩展属性去解析而报错。
def mcVersion = project.property('minecraft.version')
def loaderVersion = project.property('fabric.loader.version')
def fabricApiVersion = project.property('fabric.api.version')

// 写进 fabric.mod.json 的「用户至少要装多新的 Fabric Loader」。
//
// 这个值刻意和上面的 loaderVersion 分开：
//   loaderVersion      = 编译时用的版本（可以比较新）
//   loaderRequirement  = 对用户的要求（要尽量放宽）
//
// 实测踩过的坑：一开始直接复用了 1.21.1 那边的 >=0.16.10，
// 结果用 1.20.1 整合包的人（loader 还是 0.14.x）一装就报
// "requires version 0.16.10 or later of fabricloader, but only 0.14.22 is present"。
// 而 0.16.10 是 2025 年才发布的，1.20.1 是 2023 年的游戏，没必要卡这么高。
def loaderRequirement = project.findProperty('fabric.loader.requirement')
        ?: ">=${loaderVersion}"

// 对用户的 Java 最低要求。
// Minecraft 1.20.1 只要 Java 17，写成 21 会让只用 17 的人装不上。
def javaRequirement = ">=${project.findProperty('java.version') ?: rootProject.property('java.version')}"

base {
    archivesName = "douyin-danmaku-fabric-${mcVersion}"
}

// ---------------------------------------------------------------------
//  共用核心源码
//  common/src/main/java 里的代码所有版本完全一样，在这里直接挂进源码集，
//  编译进各自的 jar。它只允许依赖 JDK 与 Gson（Minecraft 自带），
//  不允许 import 任何 Fabric / NeoForge / Minecraft 的类。
//  以后加新文件不需要改这里的配置。
// ---------------------------------------------------------------------
sourceSets {
    main {
        java {
            srcDir rootProject.file('common/src/main/java')
        }
        resources {
            srcDir rootProject.file('common/src/main/resources')
        }
    }
}

// 官方 Mojang 映射：这样各个版本、各个加载器里的 Minecraft 类名/方法名
// 都一致（例如都是 Minecraft.getInstance()），端代码更好读，方便协作。
loom {
    runs {
        client {
            client()
            ideConfigGenerated true
        }
        server {
            server()
            ideConfigGenerated true
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
}

// ---------------------------------------------------------------------
//  Fabric 认的 Minecraft 版本号
//
//  坑：不能把 "[1.20.1,1.20.2)" 这种 Maven 区间写进 fabric.mod.json。
//  Fabric 的版本号比较规则是按语义化版本比的，逗号括号的区间语法它解析不了，
//  会直接判定「不匹配」，而且报错信息自相矛盾
//  （说需要 1.20.1，但装的就是 1.20.1 却说不匹配）。
//
//  所以这里直接用配置里的具体版本号。想额外放宽到别的版本，
//  在 gradle.properties 里加一行 fabric.minecraft.version=...。
// ---------------------------------------------------------------------
def fabricMinecraftVersion = project.hasProperty('fabric.minecraft.version')
        ? project.property('fabric.minecraft.version')
        : project.property('minecraft.version')

def expandProps = [
        version       : project.version,
        modName       : rootProject.property('mod.name'),
        modDescription: rootProject.property('mod.description'),
        modAuthors    : rootProject.property('mod.authors'),
        modLicense    : rootProject.property('mod.license'),
        loaderVersion : loaderRequirement,
        minecraft     : fabricMinecraftVersion,
        javaVersion   : javaRequirement,
]

processResources {
    inputs.properties(expandProps)
    filesMatching('fabric.mod.json') {
        expand(expandProps)
    }
}

jar {
    def licenseFile = rootProject.file('LICENSE')
    if (licenseFile.exists()) {
        from(licenseFile) {
            rename { "LICENSE_${rootProject.name}" }
        }
    }
}

// ---------------------------------------------------------------------
//  把 jar 收拢到根目录 build/libs，方便直接拿
// ---------------------------------------------------------------------
tasks.register('collectJar', Copy) {
    dependsOn tasks.named('remapJar')
    from tasks.named('remapJar').flatMap { it.archiveFile }
    into rootProject.layout.buildDirectory.dir('libs')
}
