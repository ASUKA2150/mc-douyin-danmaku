# =====================================================================
#  Fabric / Minecraft 1.20.1 子项目
#
#  这里只放「和这个 Minecraft 版本有关」的版本号。
#  模组名、作者、许可证等公共信息在根 gradle.properties 里。
#
#  加新版本的做法：复制这个文件所在的整个目录，改下面这几个版本号，
#  然后在 settings.gradle 里加一行 include。
# =====================================================================

# 这个子项目针对的 Minecraft 版本。
# 注意：build/libs 里的 jar 文件名会带上这个版本号，
# 根 build.gradle 的自检会核对它和元数据是否一致。
minecraft.version=1.20.1

# Minecraft 1.20.1 用 Java 17（不是 21）。
# Java 21 是 1.20.5 才开始要求的。
java.version=17

# Fabric 相关版本。三个都要填对，否则要么编译不过，要么进游戏崩溃。
#   loader  : Fabric Loader 的版本，可以用比较新的
#   api     : Fabric API 必须是「+1.20.1」结尾的那个版本线
fabric.loom.version=1.11.8
fabric.loader.version=0.16.10

# 对用户的 Fabric Loader 最低要求（写进 fabric.mod.json）。
#
# 【这里要写完整的版本表达式，包括运算符】
# 比如 ">=0.14.22" 表示「0.14.22 或更新」。
# 如果只写 "0.14.22"，Fabric 会理解成「必须正好是 0.14.22」，
# 装了 0.15.0 的人反而报错——正好和我们的目的相反。
#
# 这个值和上面的 fabric.loader.version 是两回事：
#   fabric.loader.version      = 编译时用的版本，可以比较新
#   fabric.loader.requirement  = 要求用户至少装多新的，要尽量放宽
#
# 为什么是 0.14.22：Fabric API 从 0.92.0 起把最低 loader 要求提到了 0.15.6，
# 0.92.5 起更是提到了 0.16.10——而 0.16.10 是 2025 年才发布的。
# 1.20.1 是 2023 年的游戏版本，很多整合包（尤其 PCL / HMCL 生成的老实例）
# 还锁在 0.14.x。实测就撞到过：用户的整合包是 0.14.22，
# 模组却要求 0.16.10，一装就加载失败。
fabric.loader.requirement=>=0.14.22

# 注意：这里刻意用 0.90.4 而不是最新的 0.92.12。
# 新版 Fabric API 会把最低 loader 要求一起抬高，用旧版才能兼容老 loader。
# 0.90.4 是「对 loader 要求最低（>=0.14.21）又支持 1.20.1」的版本之一。
fabric.api.version=0.90.4+1.20.1
