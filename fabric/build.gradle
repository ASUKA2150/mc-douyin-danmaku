// =====================================================================
//  Fabric / Minecraft 1.21.1 子项目
//
//  这个文件在 fabric-1.20.1 里有一份几乎一样的副本。
//  改这里的时候记得同步过去（两边只有版本号不同，版本号本身
//  来自各自的 gradle.properties，所以通常不需要改这个文件）。
// =====================================================================

// 注意：Loom 的插件版本必须是字面量（plugins {} 块不支持属性插值），
// 所以下面这行的版本号改的时候，要连同 gradle.properties 里的
// fabric.loom.version 一起改（那个值只是给人看的文档，插件块读不到它）。
plugins {
    id 'fabric-loom' version '1.13.6'
    id 'maven-publish'
}

// 注意：这里统一用 project.property(...) 取版本号。
// 直接写 "${minecraft.version}" 是不行的——Loom 把 minecraft 注册成了
// 扩展（extension）名字，Groovy 会优先当成扩展属性去解析而报错。
def mcVersion = project.property('minecraft.version')
def loaderVersion = project.property('fabric.loader.version')
def fabricApiVersion = project.property('fabric.api.version')

// 声明给用户看的最低 Fabric Loader 要求。
//
// 为什么不直接用上面的 loaderVersion：那个是「编译时用的版本」，
// 通常取比较新的；而这里写进 fabric.mod.json 的是「用户至少要装多新的」，
// 应该尽量放宽，否则用旧整合包的人一装就报错。
//
// 实测踩过：1.21.1 那边用 >=0.16.10 没问题，但同一个值套到 1.20.1 上，
// 会让还在用 0.14.x 的 1.20.1 整合包直接加载失败。
def loaderRequirement = project.findProperty('fabric.loader.requirement')
        ?: ">=${loaderVersion}"

// 对用户的 Java 最低要求。各个 Minecraft 版本不一样
// （1.20.1 要 Java 17，1.21.1 要 Java 21），所以从各自的
// gradle.properties 里取，不能写死。
def javaRequirement = ">=${project.findProperty('java.version') ?: rootProject.property('java.version')}"

base {
    archivesName = "douyin-danmaku-fabric-${mcVersion}"
}

// ---------------------------------------------------------------------
//  共用核心源码
//  common/src/main/java 里的代码两边完全一样，在这里直接挂进源码集，
//  编译进各自的 jar。它只允许依赖 JDK 与 Gson（Minecraft 自带），
//  不允许 import 任何 Fabric / NeoForge / Minecraft 的类。
//  以后加新文件不需要改这里的配置。
// ---------------------------------------------------------------------
sourceSets {
    main {
        java {
            srcDir rootProject.file('common/src/main/java')
        }
        resources {
            srcDir rootProject.file('common/src/main/resources')
        }
    }
}

// 官方 Mojang 映射：这样 Fabric 与 NeoForge 两侧的 Minecraft 类名/方法名一致
// （例如都是 Minecraft.getInstance()），端代码更好读，方便开源协作。
loom {
    runs {
        client {
            client()
            ideConfigGenerated true
        }
        server {
            server()
            ideConfigGenerated true
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
}

// ---------------------------------------------------------------------
//  Fabric 认的 Minecraft 版本号
//
//  坑：不能把 "[1.21.1,1.21.2)" 这种 Maven 区间写进 fabric.mod.json。
//  Fabric 的版本号比较规则是按语义化版本比的，逗号括号的区间语法它解析不了，
//  会直接判定「不匹配」——而且报错信息自相矛盾
//  （说需要 1.21.1，但装的就是 1.21.1 却说不匹配）。
//
//  所以这里直接用配置里的具体版本号。想额外放宽到别的版本，
//  在 gradle.properties 里加一行：
//      fabric.minecraft.version=1.21.1
//  需要更宽的写法时（例如同时支持 1.21.1 和 1.21.2），
//  按 Fabric 的语法用 ">=1.21.1 <1.21.3" 这种形式。
//
//  注意：NeoForge 那边反过来——它用的就是 Maven 区间，别搞混。
// ---------------------------------------------------------------------
def fabricMinecraftVersion = rootProject.hasProperty('fabric.minecraft.version')
        ? rootProject.property('fabric.minecraft.version')
        : project.property('minecraft.version')

def expandProps = [
        version       : project.version,
        modName       : rootProject.property('mod.name'),
        modDescription: rootProject.property('mod.description'),
        modAuthors    : rootProject.property('mod.authors'),
        modLicense    : rootProject.property('mod.license'),
        loaderVersion : loaderRequirement,
        minecraft     : fabricMinecraftVersion,
        javaVersion   : javaRequirement,
]

processResources {
    inputs.properties(expandProps)
    filesMatching('fabric.mod.json') {
        expand(expandProps)
    }
}

jar {
    def licenseFile = rootProject.file('LICENSE')
    if (licenseFile.exists()) {
        from(licenseFile) {
            rename { "LICENSE_${rootProject.name}" }
        }
    }
}

// ---------------------------------------------------------------------
//  把 jar 收拢到根目录 build/libs，方便直接拿
// ---------------------------------------------------------------------
tasks.register('collectJar', Copy) {
    dependsOn tasks.named('remapJar')
    from tasks.named('remapJar').flatMap { it.archiveFile }
    into rootProject.layout.buildDirectory.dir('libs')
}
