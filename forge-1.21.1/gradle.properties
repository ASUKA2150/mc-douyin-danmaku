# =====================================================================
#  Forge / Minecraft 1.21.1 子项目
#
#  这里只放「和这个 Minecraft 版本 + 加载器有关」的版本号。
#  模组名、作者、许可证等公共信息在根 gradle.properties 里。
# =====================================================================

# 这个子项目针对的 Minecraft 版本。
# 注意：build/libs 里的 jar 文件名会带上这个版本号，
# 根 build.gradle 的自检会核对它和元数据是否一致。
minecraft.version=1.21.1

# Minecraft 1.21.1 用 Java 21（1.20.5 起就是 21，和 1.20.1 的 17 不同）。
java.version=21

# ---------------------------------------------------------------------
#  Forge
# ---------------------------------------------------------------------
# Forge 的版本号方案是 <mc版本>-<build>，52.x 整条线都对应 Minecraft 1.21.1。
#
# 注意 build 号是跨 MC 版本递增的，加新版本时不能照抄：
#     1.20.1 -> 47.x
#     1.21.1 -> 52.x      <- 本子项目
#     1.21.4 -> 54.x
#     1.21.5 -> 55.x
# 要去 maven.minecraftforge.net 上查对应版本的最新 build 号。
forge.version=1.21.1-52.1.16

# 对用户的 Forge 最低要求（写进 mods.toml）。
#
# 【这里要写完整的版本表达式，包括运算符】
# "[52,)" 表示「52 或更新」——好处是 52.0.x、52.1.x 全都能用，
# 不会因为用户装的是 52.0.57 而不是 52.1.16 就拒绝加载。
#
# 如果只写 "52.1.16"，Forge 会理解成「必须正好是这个版本」，
# 装了 52.0.57 的人反而报错——正好和我们的目的相反。
forge.version_range=[52,)

# 对用户的 Minecraft 版本要求（写进 mods.toml）。
#
# 【必须用这个子项目自己的版本号，不能从根 gradle.properties 拿】
# 根里的 minecraft.version_range 是给 Fabric / NeoForge 用的，
# Forge 这边要的是 Maven 风格区间。
# 踩过这个坑：Forge 1.20.1 那边一开始复用了根里的值，产出的 jar 写着
# 「需要 Minecraft 1.21.1」，装到 1.20.1 上被直接拒绝加载，
# 而且报错信息完全看不出是打包时写错了。
#
# [1.21.1,1.21.2) 表示「含 1.21.1，不含 1.21.2」——正好框住这条小版本线。
minecraft.version_range=[1.21.1,1.21.2)
