# =====================================================================
#  公共属性（Minecraft 1.20.1 分支）
#
#  这个分支只构建 1.20.1 的两个加载器端：Fabric 和 Forge。
#  完整的四个版本（含 1.21.1 的 Fabric / NeoForge）在 main 分支。
#
#  各子项目的版本号写在子项目自己的 gradle.properties 里，
#  因为 1.20.1 和 1.21.1 要用的 loader / API 版本完全不同。
# =====================================================================
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# 模组元信息（mods.toml / fabric.mod.json 都会引用这些值）
#   注意：这几项只能写 ASCII！
#   Gradle 展开资源模板时按平台默认编码读取，中文会变成乱码
#   （UTF-8 的「把」是 e6 8a 8a，会被写成 c3 a6 c2 8a c2 8a）。
#   所以中文一律用 \uXXXX 转义，例如「把」= \u628a。
#   下面是本模组的中文名与描述：
#     抖音弹幕 for Minecraft
#     把抖音直播间的弹幕实时显示到 Minecraft 聊天栏里。
mod.name=Douyin Danmaku (\u6296\u97f3\u5f39\u5e55)
mod.description=Show Douyin live danmaku in the Minecraft chat. \u628a\u6296\u97f3\u76f4\u64ad\u95f4\u7684\u5f39\u5e55\u5b9e\u65f6\u663e\u793a\u5230 Minecraft \u804a\u5929\u680f\u91cc\u3002
mod.authors=ASUKA2150

mod.version=1.0.0
mod.group=com.douyindanmaku
mod.license=MIT

# ---------------------------------------------------------------------
# Minecraft 1.20.1 用 Java 17
#   （Java 21 是 Minecraft 1.20.5 才开始要求的）
# ---------------------------------------------------------------------
java.version=17

# ---------------------------------------------------------------------
# 关于 JDK 17（编译 forge-1.20.1 需要）
# ---------------------------------------------------------------------
# Fabric 端用 JDK 21 编译也可以（只要字节码目标降到 17）。
# 但 forge-1.20.1 额外需要一个 JDK 17——Forge 的构建工具（ForgeGradle）
# 本身跑在 Java 17 上，这不是我们能改的。
#
# 【这里刻意不写死 JDK 路径】
# 每个人的 JDK 装在哪儿都不一样。把本机路径提交进仓库，
# 别人克隆下来只会看到一个指向不存在目录的配置，还得手动删。
#
# 需要编译 forge-1.20.1 时，用下面任意一种办法告诉 Gradle JDK 17 在哪：
#
#   办法一（推荐，不污染仓库）：写进【用户级】配置
#     文件位置：
#       Windows      C:\Users\<你的用户名>\.gradle\gradle.properties
#       Linux/macOS  ~/.gradle/gradle.properties
#     内容（一行，多个 JDK 用逗号隔开，用正斜杠）：
#       org.gradle.java.installations.paths=C:/Program Files/Microsoft/jdk-17.0.13.11-hotspot
#     这个文件是 Gradle 内置机制，不在仓库里，只对你本机生效。
#
#   办法二：把 JAVA_HOME 环境变量指向 JDK 17，再执行构建
#
#   办法三：只编译 Fabric 端，跳过 Forge
#     ./gradlew :fabric-1.20.1:build
#
# 什么都没做、又直接跑 ./gradlew collectJars 时才会报：
#   Cannot find a Java installation matching languageVersion=17
#
# 详见 README 的「自己编译」一节。

# ---------------------------------------------------------------------
# ForgeGradle 的证书校验开关
# ---------------------------------------------------------------------
# ForgeGradle 启动时会自己校验一次 maven.minecraftforge.net 的证书。
# 国内不少网络（以及某些杀毒软件、公司代理）会做 TLS 中间人，
# 导致校验失败并直接中断构建，报：
#     Failed to validate certificate for host 'https://maven.minecraftforge.net/'
#
# 这个是 ForgeGradle 在 GitHub 上给的官方开关（报错信息里也直接提示了）。
# 它只影响这一次额外的连通性检查，不影响 Gradle 自己下载依赖时的证书校验。
#
# 如果你在墙外、或者没遇到这个问题，可以把这行改成 true 或者直接删掉。
systemProp.net.minecraftforge.gradle.check.certs=false
