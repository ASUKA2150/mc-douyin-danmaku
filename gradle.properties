# =====================================================================
#  公共属性（Minecraft 1.21.1 分支）
#
#  这个分支只构建 1.21.1 的两个加载器端：Fabric 和 NeoForge。
#  完整的四个版本（含 1.20.1 的 Fabric / Forge）在 main 分支。
#
#  各子项目的版本号写在子项目自己的 gradle.properties 里，
#  因为 1.20.1 和 1.21.1 要用的 loader / API 版本完全不同。
# =====================================================================
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# 模组元信息（mods.toml / fabric.mod.json 都会引用这些值）
#   注意：这几项只能写 ASCII！
#   Gradle 展开资源模板时按平台默认编码读取，中文会变成乱码
#   （UTF-8 的「把」是 e6 8a 8a，会被写成 c3 a6 c2 8a c2 8a）。
#   所以中文一律用 \uXXXX 转义，例如「把」= \u628a。
#   下面是本模组的中文名与描述：
#     抖音弹幕 for Minecraft
#     把抖音直播间的弹幕实时显示到 Minecraft 聊天栏里。
mod.name=Douyin Danmaku (\u6296\u97f3\u5f39\u5e55)
mod.description=Show Douyin live danmaku in the Minecraft chat. \u628a\u6296\u97f3\u76f4\u64ad\u95f4\u7684\u5f39\u5e55\u5b9e\u65f6\u663e\u793a\u5230 Minecraft \u804a\u5929\u680f\u91cc\u3002
mod.authors=ASUKA2150

mod.version=1.0.0
mod.group=com.douyindanmaku
mod.license=MIT

# Minecraft 与 Java
minecraft.version=1.21.1
# NeoForge 用 Maven 风格区间，所以这个属性只给 NeoForge 用。
# Fabric 那边不认区间语法，它用的是 minecraft.version（具体版本号），
# 需要额外放宽时再加一行 fabric.minecraft.version=...
minecraft.version_range=[1.21.1,1.21.2)
java.version=21

# ---------------------------------------------------------------------
# Fabric 侧
# ---------------------------------------------------------------------
fabric.loom.version=1.11.8
fabric.loader.version=0.16.10

# 对用户的 Fabric Loader 最低要求，写进 fabric.mod.json。
# 这里写完整的版本表达式（带运算符）。
# 1.21.1 本身要求比较新的 loader，所以这个值可以直接沿用编译版本。
fabric.loader.requirement=>=0.16.10

fabric.api.version=0.116.17+1.21.1

# ---------------------------------------------------------------------
# NeoForge 侧
#   neoforge.version 采用 NeoForge 官方版本号方案：<mc>-<build>
#   21.1.x 整条线都对应 Minecraft 1.21.1
# ---------------------------------------------------------------------
neoforge.version=21.1.255
neoforge.version_range=[21.1.0,21.2)
moddevgradle.version=1.0.24

# ---------------------------------------------------------------------
# 这个分支不需要 JDK 17
# ---------------------------------------------------------------------
# Fabric 和 NeoForge 的构建插件都认 JDK 21，只装一个 JDK 21 就能
# 把两个 jar 都编出来。
#
# （1.20.1 的 Forge 端才需要额外的 JDK 17，因为 ForgeGradle 本身
#   跑在 Java 17 上。那个在 1.20.x 分支和 main 分支里。）

