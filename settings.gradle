pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'mc-douyin-danmaku'

// =====================================================================
//  Minecraft 1.20.1 分支
//
//  这个分支只包含 1.20.1 的两个加载器端，方便只想给 1.20.1 编译的人：
//  不用下载 1.21.1 那边的依赖。
//
//  完整的多版本工程在 main 分支，那边同时有 1.20.1 (Fabric/Forge)
//  和 1.21.1 (Fabric/NeoForge)。
//
//  为什么 1.20.1 没有 NeoForge：
//  NeoForge 是从 Minecraft 1.20.2 才开始有的，1.20.1 时代只有 Forge。
// =====================================================================

include 'fabric-1.20.1'
include 'forge-1.20.1'
