pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'mc-douyin-danmaku'

// =====================================================================
//  多版本工程
//
//  每个「Minecraft 版本 + 加载器」是一个独立的子项目，各自产出自己的 jar。
//  它们共用同一份核心代码（common/src/main/java），所以改一个 bug
//  所有版本一起修好。
//
//  加一个新版本的做法：复制一份现有的子项目目录，改子项目 gradle.properties
//  里的版本号，在这里加一行 include 即可。
// =====================================================================

// ---- Minecraft 1.21.1 ----
// 这个版本三个加载器齐全：Forge 在 1.21.1 上一直在更新（build 号 52.x），
// 和 NeoForge 并存，不像 1.20.1 那样只有 Forge。
include 'fabric-1.21.1'
project(':fabric-1.21.1').projectDir = file('fabric')

include 'neoforge-1.21.1'
project(':neoforge-1.21.1').projectDir = file('neoforge')

include 'forge-1.21.1'

// ---- Minecraft 1.20.1 ----
// 注意：1.20.1 只有 Fabric 和 Forge，没有 NeoForge——
// NeoForge 的第一个版本是给 Minecraft 1.20.2 的，1.20.1 时代只有 Forge。
include 'fabric-1.20.1'
include 'forge-1.20.1'
