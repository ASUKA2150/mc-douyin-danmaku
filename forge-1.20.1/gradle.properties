# =====================================================================
#  Forge / Minecraft 1.20.1 子项目
#
#  这里只放「和这个 Minecraft 版本 + 加载器有关」的版本号。
#  模组名、作者、许可证等公共信息在根 gradle.properties 里。
# =====================================================================

# 这个子项目针对的 Minecraft 版本。
# 注意：build/libs 里的 jar 文件名会带上这个版本号，
# 根 build.gradle 的自检会核对它和元数据是否一致。
minecraft.version=1.20.1

# Minecraft 1.20.1 用 Java 17（不是 21）。
# Java 21 是 1.20.5 才开始要求的。
java.version=17

# ---------------------------------------------------------------------
#  Forge
# ---------------------------------------------------------------------
# Forge 的版本号方案是 <mc版本>-<build>，47.x 整条线都对应 Minecraft 1.20.1。
# 47.4.26 是 1.20.1 这条线的最后一个版本。
forge.version=1.20.1-47.4.26

# 对用户的 Forge 最低要求（写进 mods.toml）。
#
# 【这里要写完整的版本表达式，包括运算符】
# "[47,)" 表示「47 或更新」——好处是 47.1、47.2、47.4 全都能用，
# 不会因为用户装的是 47.2 而不是 47.4 就拒绝加载。
#
# 如果只写 "47.4.26"，Forge 会理解成「必须正好是这个版本」，
# 装了 47.2 的人反而报错——正好和我们的目的相反。
#
# 为什么不定高一点：1.20.1 是 2023 年的游戏版本，整合包锁定的 Forge
# 版本五花八门（47.1 / 47.2 / 47.3 / 47.4 都有人用）。
# 我们只用最基础的 Forge API，所以放宽到 47 整条线最安全。
forge.version_range=[47,)

# 对用户的 Minecraft 版本要求（写进 mods.toml）。
#
# 【必须用这个子项目自己的版本号，不能从根 gradle.properties 拿】
# 根里那个 minecraft.version_range=[1.21.1,1.21.2) 是给 NeoForge 1.21.1 用的。
# 踩过这个坑：一开始直接复用了它，结果产出的 Forge jar 里写着
# 「需要 Minecraft 1.21.1」——装到 1.20.1 上会被 Forge 直接拒绝加载，
# 而且报错信息是「需要 1.21.1 但你有 1.20.1」，看起来完全摸不着头脑。
#
# 格式说明：Forge 用的是 Maven 风格的版本区间，
# [1.20.1,1.20.2) 表示「1.20.1 到 1.20.2 之间（含 1.20.1，不含 1.20.2）」
# ——正好把 1.20.1 这条小版本线框住。
minecraft.version_range=[1.20.1,1.20.2)
