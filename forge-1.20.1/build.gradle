// =====================================================================
//  Forge / Minecraft 1.20.1 子项目
//
//  为什么 Forge 需要单独一份、不能照抄 NeoForge 那份：
//
//    1. 构建插件不同
//         NeoForge 1.21.1 -> net.neoforged.moddev（ModDevGradle）
//         Forge    1.20.1 -> net.minecraftforge.gradle（ForgeGradle 6）
//
//    2. 元数据文件不同
//         NeoForge -> META-INF/neoforge.mods.toml，键名 snake_case
//         Forge    -> META-INF/mods.toml，键名 PascalCase
//
//    3. 事件 API 不同（见 DouyinDanmakuForge 里的注释）
//
//  但【映射是同一个】：两边都用官方 Mojang 映射，
//  所以 common/src/main/java 那 5500 行核心代码可以原样复用，
//  ChatRenderer 里碰 Minecraft 的那几行也几乎一样。
// =====================================================================

plugins {
    // ForgeGradle 6 是 Forge 1.20.1 的官方构建插件。
    // 版本必须是字面量（plugins {} 块不支持属性插值）。
    //
    // 为什么用 ForgeGradle 而不是更新的 ModDevGradle 2.x：
    // ModDevGradle 2.x 的 legacyforge 模式会去 maven.neoforged.net
    // 下载 neoform-runtime，而那个域名在国内被 DNS 污染（实测解析到
    // 一个 VPN 服务商），也没有任何镜像提供这个构件，所以下不下来。
    // ForgeGradle 6 只用 maven.minecraftforge.net，国内可以访问。
    id 'net.minecraftforge.gradle' version '6.0.54'
}

def mcVersion = project.property('minecraft.version')
def forgeVersion = project.property('forge.version')
def forgeVersionRange = project.property('forge.version_range')
def javaVersion = (project.findProperty('java.version')
        ?: rootProject.property('java.version')) as int

// Minecraft 版本区间。
//
// 【必须从本子项目拿，不能从根 gradle.properties 拿】
// 根里那个 minecraft.version_range 是给 NeoForge 1.21.1 用的；
// 如果 Forge 这边复用了它，产出的 jar 会写着「需要 Minecraft 1.21.1」，
// 装到 1.20.1 上直接被拒绝加载。踩过这个坑。
def minecraftRange = project.property('minecraft.version_range')

base {
    archivesName = "douyin-danmaku-forge-${mcVersion}"
}

// 用当前 JDK 编译，但字节码目标降到 1.20.1 要求的 Java 17。
// 不配 toolchain 是为了让只想编译的人不用装两个 JDK。
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaVersion
}

// ---------------------------------------------------------------------
//  共用核心源码
//  common/src/main/java 里的代码所有版本完全一样，在这里直接挂进源码集。
//  它只允许依赖 JDK 与 Gson（Minecraft 自带），
//  不允许 import 任何 Fabric / NeoForge / Forge / Minecraft 的类。
//  以后加新文件不需要改这里的配置。
// ---------------------------------------------------------------------
sourceSets {
    main {
        java {
            srcDir rootProject.file('common/src/main/java')
        }
        resources {
            srcDir rootProject.file('common/src/main/resources')
        }
    }
}

minecraft {
    // 官方 Mojang 映射。
    //
    // 关键：这样写才能和 NeoForge / Fabric 两边共用同一份核心代码——
    // 三边编译出来的 Minecraft 类名、方法名完全一致
    // （都是 net.minecraft.client.Minecraft.getInstance() 这种）。
    //
    // ForgeGradle 支持 official 这个 channel（实测 6.0.54 可用），
    // 它会自己把官方映射转成 SRG 做重混淆。
    mappings channel: 'official', version: mcVersion
}

repositories {
    mavenCentral()
    maven { name = 'Forge'; url = 'https://maven.minecraftforge.net/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${forgeVersion}"
}

// ---------------------------------------------------------------------
//  元数据模板替换
//
//  注意 Forge 1.20.1 的元数据格式和 NeoForge 完全不同：
//    - 文件名是 META-INF/mods.toml（NeoForge 是 neoforge.mods.toml）
//    - 键名是 PascalCase（modId / versionRange / displayName）
//      而 NeoForge 是 snake_case（modId / versionRange 但也有 loaderVersion 这种）
//    - 没有 loaderVersion 这个字段
// ---------------------------------------------------------------------
def expandProps = [
        version        : project.version,
        modName        : rootProject.property('mod.name'),
        modDescription : rootProject.property('mod.description'),
        modAuthors     : rootProject.property('mod.authors'),
        modLicense     : rootProject.property('mod.license'),
        minecraftRange : minecraftRange,
        forgeRange     : forgeVersionRange,
]

processResources {
    inputs.properties(expandProps)
    filesMatching('META-INF/mods.toml') {
        expand(expandProps)
    }
}

jar {
    def licenseFile = rootProject.file('LICENSE')
    if (licenseFile.exists()) {
        from(licenseFile) {
            rename { "LICENSE_${rootProject.name}" }
        }
    }
}

// ---------------------------------------------------------------------
//  把 jar 收拢到根目录 build/libs，方便直接拿
//
//  坑：ForgeGradle 的 reobfJar 是「就地重写」任务（RenameJarInPlace），
//  它直接改写 jar 任务的产物，自己并没有 archiveFile 属性。
//  所以这里 from 要用 jar 的产物，但 dependsOn 要带上 reobfJar，
//  否则拿到的会是没重混淆、在 Forge 里加载不起来的 jar。
// ---------------------------------------------------------------------
tasks.register('collectJar', Copy) {
    dependsOn tasks.named('reobfJar')
    from tasks.named('jar').flatMap { it.archiveFile }
    into rootProject.layout.buildDirectory.dir('libs')
}
