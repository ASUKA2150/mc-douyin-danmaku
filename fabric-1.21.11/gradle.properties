# Fabric 子项目属性 —— Minecraft 1.21.11
#
# 这个文件的版本号必须写在这里，不能靠根 gradle.properties：
# 根那边默认是 1.21.1，是给「1.21.1 三个加载器共用的那套」用的。
# 子项目自己的 gradle.properties 优先级更高，所以下面这几行会覆盖掉根的值。
#
# 加新版本的套路就是：复制这个目录，改这几行，再在 settings.gradle 里 include。

# 这一版要编哪个 Minecraft
minecraft.version=1.21.11

# 编译时用的 Fabric Loader / Fabric API
#   0.20.1 是 1.21.11 当前的稳定 Loader
#   0.141.6+1.21.11 是配套的 Fabric API
fabric.loader.version=0.20.1
fabric.api.version=0.141.6+1.21.11

# 写进 fabric.mod.json 的「用户至少要装多新的 Loader」。
# 和编译版本保持一致就行——1.21.11 本身就要求比较新的 Loader，
# 想放宽也没意义（旧 Loader 根本认不出 1.21.11）。
fabric.loader.requirement=>=0.20.1

# Minecraft 1.21.11 仍然跑在 Java 21 上
java.version=21

# Loom 版本只在 build.gradle 的 plugins 块里生效（那里必须是字面量），
# 这一行纯粹是文档，写在这里方便后人查。
fabric.loom.version=1.19.3
